# ✨ Manual publication of the Markdown language site and C WASM playground.
name: Otium language Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: language-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.20'
      - run: npm ci
        working-directory: lang/site
      - run: make test-site
        working-directory: lang
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lang/site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
