# Seeds and exceptions for otium-gc-lint. One entry per line:
#
#   collects NAME          NAME can run the collector
#   grows-stack NAME       NAME can move rt->stack
#   reenters NAME          both: NAME can run Otium code
#   never NAME             NAME neither collects nor grows the stack, whatever it calls
#   tag-only NAME          NAME looks only at the tag bits of its ot_value arguments
#   derives NAME           NAME returns a pointer into a managed object
#   derives-prefix PREFIX  so does every function whose name starts with PREFIX
#   indirect-safe NAME     calls through the function pointer NAME neither
#                          collect nor grow the stack. NAME is function:variable
#                          for a local or parameter, Record.field for a field
#                          (otium-gc-lint --list-effects lists them)
#   allow FUNCTION VARIABLE REASON
#                          accept the findings for VARIABLE in FUNCTION
#
# Everything that calls a seed, directly or not, inherits its effects. Calls
# through function pointers are assumed to do both.

collects oti_heap_alloc
collects oti_heap_collect
collects oti_alloc
grows-stack oti_stack

# VM entry points. They are reached from oti_heap_alloc and oti_stack anyway;
# listing them keeps the check honest if that ever stops being visible.
reenters oti_call_list
reenters oti_drive
reenters oti_invoke
reenters oti_apply
reenters oti_execute
reenters oti_enter
reenters ot_eval
reenters ot_call

# libffi runs callback_entry, and so Otium code, when foreign code calls back.
reenters ffi_call

# Host I/O callbacks cannot reenter Otium: oti_host_entry makes oti_alloc fail
# while one runs.
indirect-safe ot_io_host.open
indirect-safe ot_io_host.read
indirect-safe ot_io_host.write
indirect-safe ot_io_host.flush
indirect-safe ot_io_host.close

# libm functions.
indirect-safe numeric_rounding:round_fn
indirect-safe numeric_libm:fn

tag-only ot_is_int
tag-only ot_to_int
tag-only ot_int_bits
tag-only value_is_ptr
tag-only oti_truth
tag-only value_int_add
tag-only value_int_sub
tag-only value_int_mul

derives-prefix oti_as_
derives object_fields
derives object_bytes
derives oti_text_bytes
derives oti_bytes_data
derives oti_table_buckets
derives oti_record_type_immutable

# Findings checked by hand and accepted.

# The context is added only when run failed, and then foreign_result returns
# 0 (oti_ffi_error always does), so result is not a managed value there.
allow foreign_run result run failed, so result is 0 when library_context runs
